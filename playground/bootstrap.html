<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tadabut · Bootstrap</title>
    <style>
      .tdb-error,
      .tdb-row-error-message {
        color: var(--bs-form-invalid-color);
        font-size: 0.875em;
      }
      /* keeps inputs aligned when one shows an error */
      .table > tbody > tr.tdb-row-editing > td {
        vertical-align: top;
      }
      .table > tbody > tr.tdb-row-editing > td:not(:has(.tdb-input, .tdb-button)) {
        padding-top: calc(0.5rem + 4px);
      }
      .tdb-row-saving {
        opacity: 0.5;
      }
      .tdb-actions {
        white-space: nowrap;
      }
      .tdb-button + .tdb-button {
        margin-left: 0.25rem;
      }
      .tdb-delete-question {
        margin-right: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <h1 class="h3 mb-3">Tadabut · Bootstrap 5</h1>

      <p class="text-body-secondary">
        Same table as the vanilla page, styled with Bootstrap: <code>datatables.net-bs5</code>,
        <code>className</code> on each editor, and <code>classNames</code> for the table and the
        buttons.
      </p>

      <div id="container"></div>
    </div>

    <script type="module" src="./bootstrap.ts"></script>
  </body>
</html>
