<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tadabut · Vanilla</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      #status {
        color: #666;
        font-size: 0.9rem;
      }
      .tdb-error,
      .tdb-save-error {
        color: #c62828;
        font-size: 0.85rem;
      }
      .tdb-row-saving {
        opacity: 0.5;
      }
      .tdb-actions {
        white-space: nowrap;
      }
      .tdb-button + .tdb-button {
        margin-left: 0.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Tadabut · Vanilla</h1>

    <div class="toolbar">
      <button id="create" type="button">Create</button>
      <button id="destroy" type="button">Destroy</button>
      <button id="random-data" type="button">Random data</button>
    </div>

    <div class="toolbar">
      <label>
        Mode
        <select id="mode">
          <option value="single">single</option>
          <option value="multiple">multiple</option>
        </select>
      </label>
      <label>
        <input id="buttons" type="checkbox" checked />
        Buttons
      </label>
    </div>

    <p id="status"></p>

    <p>
      Try: Edit, Save, Cancel, Enter and Escape in an input, a name of "error" to see a failed save,
      and sorting before editing.
    </p>

    <div id="container"></div>

    <script type="module" src="./vanilla.ts"></script>
  </body>
</html>
